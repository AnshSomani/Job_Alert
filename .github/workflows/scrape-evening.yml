name: 🌙 Evening Scrape (Free Sources Only)

on:
  schedule:
    # 3:30 PM UTC = 9:00 PM IST every day
    - cron: '30 15 * * *'
  workflow_dispatch:

# FIX Issue 1: Removed 'contents: write' — using Actions Cache now, not git commits.
permissions:
  contents: read

jobs:
  scrape:
    name: Run Job Scraper (Free Mode)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # FIX Issue 13: Cache node_modules keyed by package-lock.json hash.
      - name: 📦 Cache node_modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: 📦 Install dependencies (only if cache miss)
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

      # FIX Issue 1: Restore seen_jobs.json from Actions Cache.
      # Shares the same cache key space as the morning run so both runs
      # see the same deduplication database.
      - name: 🗄 Restore seen_jobs cache
        uses: actions/cache/restore@v4
        with:
          path: data/seen_jobs.json
          key: seen-jobs-db-${{ github.run_id }}
          restore-keys: |
            seen-jobs-db-

      - name: 🤖 Run job scraper (Free Sources Only — no SerpAPI)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          USE_SERPAPI: 'false'
          DRY_RUN: 'false'
        run: node src/main.js

      # FIX Issue 1: Save updated DB to cache after run.
      - name: 🗄 Save seen_jobs cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/seen_jobs.json
          key: seen-jobs-db-${{ github.run_id }}
